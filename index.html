<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medication Chart</title>
<style>
  @page { size: A4 portrait; margin: 12mm 14mm 8mm; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    background: #eee;
  }

  /* Screen-only controls */
  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    background: #222;
    color: white;
  }
  .controls button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    padding: 4px 10px;
    height: 34px;
    cursor: pointer;
  }
  .controls input {
    font: inherit;
    padding: 6px 8px;
    width: 150px;
    height: 34px;
  }
  .controls select {
    font: inherit;
    padding: 6px 8px;
    height: 34px;
  }
  .controls label {
    display: inline-flex;
    align-items: center;
    height: 34px;
  }
  .controls label[for="pageSize"] {
    margin-left: auto;
  }
  .repo-link {
    display: inline-flex;
    align-items: center;
    height: 34px;
    color: white;
  }
  .repo-link svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }
  .month-label {
    min-width: 220px;
    text-align: center;
    font-weight: bold;
  }

  .page {
    display: flex;
    flex-direction: column;
    width: var(--page-width);
    height: var(--page-height);
    margin: 10px auto;
    padding: 12mm 10mm 8mm;
    background: white;
    box-shadow: 0 2px 12px rgb(0 0 0 / 18%);
    overflow: hidden;
  }
  .page-footer {
    flex-shrink: 0;
    margin-top: auto;
    text-align: center;
    font-size: 7pt;
  }
  .page-footer a {
    color: #aaa;
  }

  .month-block {
    display: flex;
    align-items: stretch;
    flex-shrink: 0;
    margin-bottom: 3.5mm;
  }
  .month-block:last-child {
    margin-bottom: 0;
  }

  .year-divider {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    margin: 1mm 0 1.5mm 22px;
    color: #444;
    font-size: 7pt;
    font-weight: bold;
  }
  .year-divider::before,
  .year-divider::after {
    content: '';
    flex: 1;
    border-top: 1px solid #999;
  }

  /* Rotated Title Layout */
  .title-side {
    width: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .title-side h2 {
    margin: 0;
    font-size: 8.5pt;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    transform: rotate(-90deg);
  }

  .calendar {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
    font-size: 7.5pt;
  }
  .calendar th {
    height: 4.5mm;
    font-weight: bold;
    border-bottom: 1px solid #111;
    padding: 0;
    font-size: 7pt;
  }
  .calendar td {
    border: 1px solid #ddd;
    vertical-align: top;
    padding: 0.8mm 1mm;
    height: 6mm;
  }
  .calendar td.empty {
    background: #fafafa;
  }
  .day {
    vertical-align: middle;
    text-align: center;
    white-space: nowrap;
  }
  .num {
    font-size: 12px;
    margin-right: 4px;
  }
  .mark {
    font-size: 12px;
    color: #444;
  }

  @media print {
    body { background: white; }
    .controls { display: none !important; }
    .page {
      width: var(--page-width);
      height: var(--page-height);
      margin: 0;
      padding: 0;
      box-shadow: none;
    }
    .month-block { page-break-inside: avoid; }
    .calendar td { height: 6.2mm; }
  }
</style>
</head>
<body>
<div class="controls">
  <button id="prev" aria-label="Previous month">←</button>
  <div id="monthLabel" class="month-label"></div>
  <button id="next" aria-label="Next month">→</button>
  <input id="repeatInput" value="[am] [pm]" aria-label="Repeating text">
  <label for="pageSize">Page size</label>
  <select id="pageSize" aria-label="Page size">
    <option value="a4" selected>A4</option>
    <option value="letter">Letter</option>
    <option value="legal">Legal</option>
  </select>
  <button id="print" type="button" aria-label="Print medication chart">🖨 Print</button>
  <a class="repo-link" href="https://github.com/d1manson/medicine-calendar/" aria-label="Open GitHub repository" title="Open GitHub repository">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.531 16 8.031 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656Z"/>
    </svg>
  </a>
</div>

<main class="page" id="container">
  <!-- Months will render here -->
  <footer class="page-footer">
    <a href="https://d1manson.github.io/medicine-calendar/">d1manson.github.io/medicine-calendar</a>
  </footer>
</main>

<script>
  const pageSizes = {
    a4: { width: '194mm', height: '281mm', printSize: 'A4' },
    letter: { width: '204mm', height: '267mm', printSize: 'Letter' },
    legal: { width: '204mm', height: '344mm', printSize: 'Legal' },
  };

  const now = new Date();
  let baseMonth = new Date(now.getFullYear(), now.getMonth() + (now.getDate() >= 15 ? 1 : 0), 1);

  const monthNameFormatter = new Intl.DateTimeFormat('en-GB', {
    month: 'long',
  });

  const label = document.getElementById('monthLabel');
  const container = document.getElementById('container');
  const repeatInput = document.getElementById('repeatInput');
  const pageSize = document.getElementById('pageSize');
  const pageStyle = document.createElement('style');
  document.head.appendChild(pageStyle);

  function updatePageSize() {
    const size = pageSizes[pageSize.value];
    document.documentElement.style.setProperty('--page-width', size.width);
    document.documentElement.style.setProperty('--page-height', size.height);
    pageStyle.textContent = `@page { size: ${size.printSize} portrait; }`;
  }

  function render() {
    container.querySelectorAll('.month-block, .year-divider').forEach(element => element.remove());

    const startMonthText = new Intl.DateTimeFormat('en-GB', {
      month: 'long',
      year: 'numeric'
    }).format(baseMonth)
    label.textContent = `starting ${startMonthText}`;

    let previousMonth = null;

    for (let i = 0; ; i++) {
      const currentMonth = new Date(baseMonth.getFullYear(), baseMonth.getMonth() + i, 1);
      const monthBlock = renderSingleMonth(currentMonth);

      let yearDivider = null;
      if (i === 0 && currentMonth.getMonth() === 0) {
        yearDivider = renderYearDivider(currentMonth.getFullYear(), monthBlock);
      } else if (i > 0 && currentMonth.getFullYear() !== previousMonth.getFullYear()) {
        yearDivider = renderYearDivider(currentMonth.getFullYear(), monthBlock);
      }

      if (container.scrollHeight > container.clientHeight) {
        monthBlock.remove();
        yearDivider?.remove();
        break;
      }

      previousMonth = currentMonth;
    }
  }

  function renderYearDivider(year, beforeElement = null) {
    const divider = document.createElement('div');
    divider.className = 'year-divider';
    divider.textContent = year;

    if (beforeElement) {
      container.insertBefore(divider, beforeElement);
    } else {
      container.insertBefore(divider, container.querySelector('.page-footer'));
    }

    return divider;
  }

  function renderSingleMonth(date) {
    const monthBlock = document.createElement('div');
    monthBlock.className = 'month-block';

    const titleDiv = document.createElement('div');
    titleDiv.className = 'title-side';
    titleDiv.innerHTML = `<h2>${monthNameFormatter.format(date)}</h2>`;
    monthBlock.appendChild(titleDiv);

    const table = document.createElement('table');
    table.className = 'calendar';
    table.setAttribute('aria-label', `Medication chart for ${monthNameFormatter.format(date)}`);
    table.innerHTML = `
      <thead>
        <tr>
          <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th>
          <th>Fri</th><th>Sat</th><th>Sun</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = table.querySelector('tbody');
    const year = date.getFullYear();
    const m = date.getMonth();
    const days = new Date(year, m + 1, 0).getDate();

    // Convert JS Sunday=0 to Monday=0
    const firstDay = (new Date(year, m, 1).getDay() + 6) % 7;
    const weeks = Math.ceil((firstDay + days) / 7);

    let day = 1;
    for (let w = 0; w < weeks; w++) {
      const tr = document.createElement('tr');

      for (let d = 0; d < 7; d++) {
        const td = document.createElement('td');

        if ((w === 0 && d < firstDay) || day > days) {
          td.className = 'empty';
        } else {
          td.innerHTML =
            '<div class="day">' +
              '<span class="num">' + day + '</span>' +
              '<span class="mark">' + escapeHtml(repeatInput.value) + '</span>' +
            '</div>';
          day++;
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    monthBlock.appendChild(table);
    container.insertBefore(monthBlock, container.querySelector('.page-footer'));
    return monthBlock;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  document.getElementById('prev').onclick = () => {
    baseMonth = new Date(baseMonth.getFullYear(), baseMonth.getMonth() - 1, 1);
    render();
  };
  document.getElementById('next').onclick = () => {
    baseMonth = new Date(baseMonth.getFullYear(), baseMonth.getMonth() + 1, 1);
    render();
  };
  repeatInput.addEventListener('input', render);
  document.getElementById('print').addEventListener('click', () => window.print());
  pageSize.addEventListener('change', () => {
    updatePageSize();
    render();
  });

  updatePageSize();
  render();
</script>
</body>
</html>
